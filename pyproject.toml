# Source unique des dépendances backend (spécifications V0.3 §13.1, D-09).
# requirements.txt est un artefact verrouillé généré par `uv pip compile`,
# jamais édité à la main.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "science-ai-writer-ide"
version = "0.3.1"
description = "Environnement local multi-agents d'assistance à la rédaction académique"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "aiosqlite>=0.20",
  "sqlite-vec>=0.1.6",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "fastembed>=0.3",
  "langgraph>=0.2",
  "ollama>=0.3",
  "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
  "integration: nécessite un environnement externe (Ollama, Quarto, GPU)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Les scripts de vérification et les spikes s'exécutent hors application :
# ils ont le droit d'ouvrir SQLite en synchrone pour observer le moteur.
"scripts/*.py" = ["TID251"]
"spikes/*.py" = ["TID251"]
"backend/tests/*" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR-001 : accès base exclusivement via aiosqlite dans le code applicatif.
"sqlite3".msg = "ADR-001 : le code applicatif accède à SQLite via aiosqlite uniquement."
